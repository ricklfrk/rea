name: Sync upstream (morluto/rea)
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork from upstream
        run: gh repo sync ricklfrk/rea --source morluto/rea -b main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
